- name: Agregar Lineas
  hosts: all
  gather_facts: false

  vars:
    archivo_destino: ""
    linea_a_insertar: ""

  tasks:

    - name: Convertir texto multilínea en lista limpia
      ansible.builtin.set_fact:
        lineas_lista: >-
          {{ linea_a_insertar.splitlines() | map('trim') | select('!=', '') | list }}

    - name: Insertar múltiples líneas si no existen
      ansible.builtin.lineinfile:
        path: "{{ archivo_destino }}"
        line: "{{ item }}"
        regexp: "^{{ item | regex_escape() }}"
        create: false
        insertafter: EOF
      loop: "{{ lineas_lista }}"
      register: resultado_linea

    - name: Mostrar mensaje si se agregó al menos una línea  # noqa no-handler
      ansible.builtin.debug:
        msg: "✅ Se agrego la linea o lineas en el archivo  {{ archivo_destino }}"
      when: resultado_linea.changed

    - name: Mostrar mensaje si no se agregó ninguna línea
      ansible.builtin.debug:
        msg: "⚠️ No se agregó ninguna línea al archivo {{ archivo_destino }} porque ya existe"
      when: not resultado_linea.changed
