---

- name: Copia Archivos
  hosts: all
  gather_facts: false

  vars:
    ruta_origen: "/tmp/"
    nombre_directorio: "paquete_nuevo"
    ruta_destino: "/tmp/destino/"

    directorios_disponibles:
      - nombre: "1001"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/configuration/vouchers/1001/templates/"
      - nombre: "1003"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/configuration/vouchers/1003/templates/"
      - nombre: "1004"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/configuration/vouchers/1004/templates/"
      - nombre: "configuration"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/configuration/"
      - nombre: "parcheRest"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/deployments/bridge-server-rest-liverpool.war/WEB-INF/lib/"
      - nombre: "WEB-INF"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/deployments/bridge-server-rest-liverpool.war/WEB-INF/"
      - nombre: "vouchers"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/configuration/vouchers/"
      - nombre: "properties"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/configuration/properties/"
      - nombre: "deployments23"
        destino: "/home/dockers/wildfly-23.0.0.Final/standalone/deployments/"
      - nombre: "deployments18"
        destino: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/deployments/"

  tasks:

    - name: Crear directorio temporal destino
      ansible.builtin.file:
        path: "{{ ruta_destino }}{{ nombre_directorio }}"
        state: directory
        mode: '0755'

    - name: Descomprimir archivo tar.gz
      ansible.builtin.unarchive:
        src: "{{ ruta_origen }}{{ directorio_comprimido }}"
        dest: "{{ ruta_destino }}{{ nombre_directorio }}"
        extra_opts: ['--strip-components=1', '--show-stored-names']
        remote_src: true

    - name: Copiar carpetas seleccionadas desde origen al destino definido
      ansible.builtin.command: >
        cp -ra {{ ruta_origen }}{{ nombre_directorio }}/{{ item.nombre }}/. {{ item.destino }}
      loop: "{{ directorios_disponibles }}"
      when: item.nombre in dir1000
      changed_when: true

    - name: Buscar archivos en los directorios seleccionados
      ansible.builtin.find:
        paths: "{{ ruta_origen }}{{ nombre_directorio }}/{{ item }}"
        file_type: file
      loop: "{{ dir1000 }}"
      register: archivos_origen

    - name: Obtener metadata de archivos en origen
      ansible.builtin.stat:
        path: "{{ item.1.path }}"
      loop: "{{ archivos_origen.results | subelements('files', skip_missing=True) }}"
      register: meta_origen
      no_log: true

    - name: Obtener metadata de archivos en destino
      ansible.builtin.stat:
        path: >-
          {{ item.1.path | regex_replace(
               '^' + ruta_origen + nombre_directorio + '/' + item.0.item,
               (directorios_disponibles | selectattr('nombre','equalto',item.0.item) | first).destino | regex_replace('/$','')
             ) }}
      loop: "{{ archivos_origen.results | subelements('files', skip_missing=True) }}"
      register: meta_destino
      no_log: true

    - name: Validar directorios completos (por mtime exacto)
      vars:
        archivos_dir: "{{ archivos_origen.results | selectattr('item', 'equalto', item) | map(attribute='files') | list | flatten }}"
      loop: "{{ dir1000 }}"
      loop_control:
        loop_var: item
      ansible.builtin.debug:
        msg: >-
          {% set errores = [] %}
          {% for f in archivos_dir %}
            {% set origen = (meta_origen.results | selectattr('stat.path','equalto',f.path) | map(attribute='stat.mtime') | first | default('NA')) %}
            {% set destino = (meta_destino.results | selectattr('stat.path','equalto',
                              f.path | regex_replace('^' + ruta_origen + nombre_directorio + '/' + item,
                              (directorios_disponibles | selectattr('nombre','equalto',item) | first).destino | regex_replace('/$',''))
                            ) | map(attribute='stat.mtime') | first | default('NO EXISTE')) %}
            {% if origen != destino %}
              {% set _ = errores.append(f.path ~ ' (origen mtime: ' ~ origen|string ~ ' / destino mtime: ' ~ destino|string ~ ')') %}
            {% endif %}
          {% endfor %}
          {{ '✅ Se copiaron de forma correcta todos los archivos al directorio ' ~ item
             if errores | length == 0
             else '❌ Diferencias encontradas en el directorio ' ~ item ~ ':\n- ' ~ (errores | join('\n- ')) }}
