---
# ==============================================================================
# PLAY 1: Obtener credenciales de CyberArk y configurar hosts F5 en memoria
# ==============================================================================
- name: 1. Recuperar credenciales desde CyberArk CCP para F5
  hosts: localhost
  gather_facts: false
  vars:
    safe: "CNJR_TEST_ATMOPER"       # Nombre del Safe donde están las cuentas de F5
    f5_user: "atmoper"      # Usuario de administración de la consola del F5

  tasks:
    - name: Parsear la variable del Survey a una lista de IPs
      ansible.builtin.set_fact:
        lista_ips: "{{ survey_ips.splitlines() | map('trim') | select() | list }}"

    - name: Recuperar passwords de CyberArk y agregar F5s dinámicamente
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: f5_dinamicos
        ansible_host: "{{ item }}"
        ansible_user: "{{ f5_user }}"
        # Recupera el objeto usando la convención IP-admin (ej: 10.0.0.1-admin)
        ansible_password: >-
          {{ lookup('cyberark_credential', {
            'api_base_url': ansible_cyberark_ccp_url,
            'app_id': ansible_cyberark_app_id,
            'safe': safe,
            'object': item ~ '-' ~ f5_user,
            'validate_certs': false
          }) }}
        ansible_connection: local
      loop: "{{ lista_ips }}"
      no_log: false # Cambiar a false únicamente si necesitas depurar la llamada a CCP

# ==============================================================================
# PLAY 2: Prueba de conectividad vía API REST contra la consola del F5
# ==============================================================================
- name: 2. Validar conectividad iControl REST con el F5
  hosts: f5_dinamicos
  gather_facts: false

  tasks:
    - name: Consultar la hora del sistema en el F5 via iControl REST API
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}/mgmt/tm/sys/clock"
        method: GET
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: f5_response

    - name: Mostrar reporte de conexión al F5
      ansible.builtin.debug:
        msg:
          - "=== REPORTE DE CONEXIÓN F5 BIG-IP ==="
          - "IP del equipo: {{ inventory_hostname }}"
          - "Estado API: CONEXIÓN Y AUTENTICACIÓN EXITOSAS (Status 200)"
          # Extraemos la hora adaptada a la nueva estructura JSON de F5 v17+
          - "Hora del F5: {{ f5_response.json.entries['https://localhost/mgmt/tm/sys/clock/0'].nestedStats.entries.fullDate.description | default('Hora no disponible') }}"
