- name: Actualiza archivo
  hosts: all
  gather_facts: false

  tasks:

    - name: Actualiza numero de tienda
      ansible.builtin.replace:
        path: "{{ ruta_origen }}{{ archivo1 }}"
        regexp: '<storeCode>(.*?)</storeCode>'
        replace: '<storeCode>{{ num_tienda }}</storeCode>'
      register: resultado_store

    - name: Validar valor actual de storeCode
      ansible.builtin.shell: "grep '<storeCode>' {{ ruta_origen }}{{ archivo1 }}"
      register: validar_store
      failed_when: validar_store.rc != 0
      changed_when: false

    - name: Mostrar resultado numero de tienda
      ansible.builtin.debug:
        msg: |
          ✅ Se actualizó el número de tienda en {{ archivo1 }}
          Nuevo valor -> {{ validar_store.stdout }}
      when: resultado_store.changed and validar_store.rc == 0

    - name: Mostrar resultado numero de tienda
      ansible.builtin.debug:
        msg: |
          ⚠️  No se realizaron cambios en {{ archivo1 }}
          Valor actual -> {{ validar_store.stdout }}
      when: not resultado_store.changed and validar_store.rc == 0


    - name: Actualiza direccion de la tienda
      ansible.builtin.lineinfile:
        path: "{{ ruta_origen_p }}{{ archivo2 }}"
        regex: '^label.transaction.ej.message='
        line: 'label.transaction.ej.message={{ dir_tienda }}'
      register: resultado_direccion

    - name: Validar valor actual de direccion
      ansible.builtin.shell: "grep '^label.transaction.ej.message=' {{ ruta_origen_p }}{{ archivo2 }}"
      register: validar_direccion
      failed_when: validar_direccion.rc != 0
      changed_when: false

    - name: Mostrar resultado direccion
      ansible.builtin.debug:
        msg: |
          ✅ Se actualizó la dirección de la tienda en {{ archivo2 }}
          Nuevo valor -> {{ validar_direccion.stdout }}
      when: resultado_direccion.changed and validar_direccion.rc == 0

    - name: Mostrar resultado direccion
      ansible.builtin.debug:
        msg: |
          ⚠️  No se realizaron cambios en {{ archivo2 }}
          Valor actual -> {{ validar_direccion.stdout }}
      when: not resultado_direccion.changed and validar_direccion.rc == 0

    - name: Actualiza IPs preservando indentación
      ansible.builtin.replace:
        path: "{{ ruta_origen }}{{ archivo3 }}"
        regexp: '(?s)(^[ \t]*)<agentNodes>.*?</agentNodes>'
        replace: |-
          \1<agentNodes>
          \1        <agent>
          \1                <ip>{{ ip_1 }}</ip>
          \1        </agent>
          \1        <agent>
          \1                <ip>{{ ip_2 }}</ip>
          \1        </agent>
          \1</agentNodes>
      register: resultado_ips


    - name: Validar valor actual de IPs
      ansible.builtin.shell: "grep '<ip>' {{ ruta_origen }}{{ archivo3 }}"
      register: validar_ips
      failed_when: validar_ips.rc != 0
      changed_when: false

    - name: Mostrar resultado IPs
      ansible.builtin.debug:
        msg: |
          ✅ Se actualizaron las IPs en {{ archivo3 }}
          Nuevos valores ->
          {{ validar_ips.stdout }}
      when: resultado_ips.changed and validar_ips.rc == 0

    - name: Mostrar resultado IPs
      ansible.builtin.debug:
        msg: |
          ⚠️  No se realizaron cambios en {{ archivo3 }}
          Valores actuales ->
          {{ validar_ips.stdout }}
      when: not resultado_ips.changed and validar_ips.rc == 0
