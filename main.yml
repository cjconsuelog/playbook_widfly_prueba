---
- name: "Baja controlada de WildFly mediante CyberArk CCP"
  hosts: all
  gather_facts: false

  # Cargamos las variables de conexion a CyberArk y el catalogo de versiones de WildFly
  vars_files:
    - vars/main.yml

  vars:
    # Mapeamos la opcion elegida en el Survey ("18" o "23") contra nuestro catalogo
    wildfly_config: "{{ wildfly_procesos[wildfly_version_seleccionada | string] | default({}) }}"
    target_process: "{{ wildfly_config.nombre | default('') }}"
    # Filtro estricto para asegurar que solo afectemos procesos Java de esa version exacta
    process_regex: "java.*{{ target_process }}"
    # Variables iniciales para el reporte final al usuario
    estado_final: "NO_INICIADO"
    detalle_error: "Ejecucion completada sin errores"

  tasks:
    - name: Flujo principal de validacion y baja de servicio
      block:
        # -------------------------------------------------------------------------
        # PASO 1: Validar que el usuario haya seleccionado una version valida en AAP
        # -------------------------------------------------------------------------
        - name: "1. Validar version seleccionada en el Survey"
          ansible.builtin.assert:
            that:
              - target_process != ''
            fail_msg: "Version invalida recibida ('{{ wildfly_version_seleccionada }}'). Solo se permite 18 o 23."

        # -------------------------------------------------------------------------
        # PASO 2: Obtener credenciales dinamicas desde CyberArk CCP
        # -------------------------------------------------------------------------
        - name: "2. Consultar credencial del servidor en CyberArk CCP"
          ansible.builtin.set_fact:
            cyberark_retrieved_pass: "{{ lookup('cyberark_credential', {
                'api_base_url': ansible_cyberark_ccp_url,
                'app_id': ansible_cyberark_app_id,
                'safe': safe,
                'object': object_name,
                'validate_certs': false
              }) }}"
          no_log: true
          delegate_to: localhost

        - name: "3. Configurar sesion SSH con el usuario de CyberArk"
          ansible.builtin.set_fact:
            ansible_user: "{{ ssh_user }}"
            ansible_password: "{{ cyberark_retrieved_pass }}"
          no_log: true

        # -------------------------------------------------------------------------
        # PASO 3: Validar acceso SSH y estado actual de ambos servicios (18 y 23)
        # -------------------------------------------------------------------------
        - name: "4. Validar conectividad SSH y listar instancias WildFly activas"
          ansible.builtin.command:
            cmd: "pgrep -af 'java.*wildfly'"
          register: servicios_activos_inicio
          changed_when: false
          failed_when: false

        - name: "Log: Estado inicial de servicios en el servidor"
          ansible.builtin.debug:
            msg:
              - "Conexion SSH exitosa con usuario: {{ ssh_user }}"
              - "Instancias WildFly detectadas actualmente en el servidor:"
              - "{{ servicios_activos_inicio.stdout_lines if servicios_activos_inicio.rc == 0 else ['Ninguna instancia de WildFly esta corriendo en este momento.'] }}"

        # -------------------------------------------------------------------------
        # PASO 4: Validar permisos sudo pasando la clave de forma segura por entorno
        # -------------------------------------------------------------------------
        - name: "5. Verificar permisos sudo del usuario PAM"
          ansible.builtin.raw: "printf '%s\\n' \"$PASS_CYBERARK\" | sudo -S -p '' -l 2>&1"
          environment:
            # Pasamos la clave como variable de entorno para evitar errores con simbolos especiales
            PASS_CYBERARK: "{{ cyberark_retrieved_pass }}"
          register: validacion_sudo
          no_log: true
          changed_when: false
          failed_when: false

        - name: "6. Confirmar que el usuario tiene autorizacion sudo"
          ansible.builtin.assert:
            that:
              - validacion_sudo.rc == 0
            fail_msg: "SUDO_RECHAZADO: El usuario '{{ ssh_user }}' conecto por SSH, pero el servidor rechazo su contrasena o permisos sudo."

        # -------------------------------------------------------------------------
        # PASO 5: Buscar especificamente el PID de la version elegida en el Survey
        # -------------------------------------------------------------------------
        - name: "7. Buscar proceso activo para {{ target_process }}"
          ansible.builtin.command:
            cmd: "pgrep -af '{{ process_regex }}'"
          register: proceso_objetivo
          changed_when: false
          failed_when: false

        - name: "8. Guardar PIDs encontrados antes de detener"
          ansible.builtin.set_fact:
            estado_final: "SIN_CAMBIOS_YA_ESTABA_ABAJO"
            pids_iniciales: "{{ proceso_objetivo.stdout_lines | map('split', ' ') | map('first') | list if proceso_objetivo.rc == 0 else [] }}"

        # -------------------------------------------------------------------------
        # PASO 6: Si el servicio esta arriba, detenerlo y confirmar su baja
        # -------------------------------------------------------------------------
        - name: "9. Detener {{ target_process }} y validar baja"
          when: proceso_objetivo.rc == 0
          block:
            - name: "Log: Iniciando detencion del servicio"
              ansible.builtin.debug:
                msg: "Se detecto {{ target_process }} activo con PID(s): {{ pids_iniciales | join(', ') }}. Enviando senal de detencion (pkill -9)..."

            # Ejecutamos sudo pkill pasando la password por variable de entorno segura
            - name: "Ejecutar sudo pkill -9 sobre {{ target_process }}"
              ansible.builtin.raw: "printf '%s\\n' \"$PASS_CYBERARK\" | sudo -S -p '' pkill -9 -f '{{ process_regex }}' 2>&1"
              environment:
                PASS_CYBERARK: "{{ cyberark_retrieved_pass }}"
              register: ejecucion_pkill
              no_log: true
              changed_when: ejecucion_pkill.rc == 0

            # Esperamos y reintentamos hasta confirmar que el proceso desaparecio del servidor
            - name: "Validar que {{ target_process }} ya no este en ejecucion"
              ansible.builtin.command:
                cmd: "pgrep -af '{{ process_regex }}'"
              register: validacion_post_baja
              changed_when: false
              failed_when: false
              until: validacion_post_baja.rc != 0
              retries: 5
              delay: 2

            - name: "Confirmar que el proceso fue eliminado correctamente"
              ansible.builtin.assert:
                that:
                  - validacion_post_baja.rc != 0
                fail_msg: "PROCESO_ACTIVO: Se ejecuto pkill -9, pero el PID {{ validacion_post_baja.stdout_lines }} sigue vivo en el servidor."

            # Consultamos de nuevo todas las instancias para dejar evidencia en el log
            - name: "Consultar estado final de servicios en el servidor"
              ansible.builtin.command:
                cmd: "pgrep -af 'java.*wildfly'"
              register: servicios_activos_fin
              changed_when: false
              failed_when: false

            - name: "Log: Confirmacion de baja y servicios restantes"
              ansible.builtin.debug:
                msg:
                  - "Servicio detenido exitosamente: {{ target_process }} (PIDs eliminados: {{ pids_iniciales | join(', ') }})"
                  - "Instancias WildFly que permanecen activas en el servidor:"
                  - "{{ servicios_activos_fin.stdout_lines if servicios_activos_fin.rc == 0 else ['Ninguna instancia de WildFly quedo activa.'] }}"

            - name: "Actualizar estado final a exitoso"
              ansible.builtin.set_fact:
                estado_final: "DETENIDO_EXITOSAMENTE"

      # ---------------------------------------------------------------------------
      # MANEJO DE ERRORES: Traduce cualquier fallo tecnico a un mensaje claro
      # ---------------------------------------------------------------------------
      rescue:
        - name: "Identificar motivo claro del error"
          ansible.builtin.set_fact:
            estado_final: "ERROR"
            detalle_error: >-
              {%- if 'Version invalida' in (ansible_failed_result.msg | default('')) -%}
                Error en Survey: La opcion '{{ wildfly_version_seleccionada }}' no es valida. Selecciona 18 o 23.
              {%- elif 'CyberArk CCP' in (ansible_failed_task.name | default('')) -%}
                Error en CyberArk CCP: No se pudo obtener la credencial (Safe: {{ safe | default('N/A') }}, Objeto: {{ object_name | default('N/A') }}). Valida permisos del AppID o disponibilidad de CCP.
              {%- elif 'Validar conectividad SSH' in (ansible_failed_task.name | default('')) -%}
                Error de Conexion SSH: No se pudo establecer sesion con {{ inventory_hostname }} usando el usuario '{{ ssh_user }}'. Revisa conectividad de red o vigencia de la clave en PAM.
              {%- elif 'SUDO_RECHAZADO' in (ansible_failed_result.msg | default('')) -%}
                Error de Permisos PAM (sudo): El usuario '{{ ssh_user }}' entro por SSH pero fallo la validacion de sudo ({{ validacion_sudo.stdout | default('Sin detalle') | regex_replace('[\\r\\n]+', ' ') | trim }}).
              {%- elif 'Ejecutar sudo pkill' in (ansible_failed_task.name | default('')) -%}
                Error al detener servicio: El usuario '{{ ssh_user }}' no tiene permiso en sudoers para ejecutar pkill (Detalle: {{ ejecucion_pkill.stdout | default('Permiso denegado') | regex_replace('[\\r\\n]+', ' ') | trim }}).
              {%- elif 'PROCESO_ACTIVO' in (ansible_failed_result.msg | default('')) -%}
                El proceso {{ target_process }} no respondio a kill -9 (posible bloqueo de disco/kernel en el servidor).
              {%- else -%}
                Fallo inesperado en el paso '{{ ansible_failed_task.name | default('Desconocido') }}': {{ ansible_failed_result.msg | default('Revisa conectividad con el nodo') }}.
              {%- endif -%}

        - name: "Mostrar mensaje de error normalizado"
          ansible.builtin.fail:
            msg: "[FALLO EN {{ inventory_hostname }}] {{ detalle_error }}"

      # ---------------------------------------------------------------------------
      # RESUMEN FINAL: Siempre se imprime al terminar cada servidor
      # ---------------------------------------------------------------------------
      always:
        - name: "Resumen de ejecucion"
          ansible.builtin.debug:
            msg:
              - "=================================================="
              - "Servidor: {{ inventory_hostname }}"
              - "Servicio solicitado: {{ target_process }}"
              - "Resultado: {{ estado_final }}"
              - "PIDs detenidos: {{ pids_iniciales | default([]) | join(', ') if (pids_iniciales | default([]) | length > 0) else 'Ninguno' }}"
              - "Detalle: {{ detalle_error }}"
              - "=================================================="