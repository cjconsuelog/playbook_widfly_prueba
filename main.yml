---
- name: "Validacion de conexion CyberArk CCP y detencion de WildFly"
  hosts: all
  gather_facts: false

  vars_files:
    - vars/main.yml

  vars:
    wildfly_config: "{{ wildfly_procesos[wildfly_version_seleccionada | string] | default({}) }}"
    target_process: "{{ wildfly_config.nombre | default('') }}"
    process_regex: "java.*{{ target_process }}"
    estado_final: "NO_INICIADO"
    detalle_error: "Sin errores"

  tasks:
    - name: Bloque principal de autenticacion CyberArk y detencion de WildFly
      block:
        # 1. Validar entrada del Survey
        - name: 1. Validar parametro recibido desde el Survey
          ansible.builtin.assert:
            that:
              - target_process != ''
            fail_msg: "PARAMETRO_INVALIDO: Se recibio '{{ wildfly_version_seleccionada }}'. Solo se admite '18' o '23'."

        # 2. Recuperar credencial desde CyberArk CCP
        - name: 2. Consultar password en CyberArk CCP
          ansible.builtin.set_fact:
            cyberark_retrieved_pass: "{{ lookup('cyberark_credential', {
                'api_base_url': ansible_cyberark_ccp_url,
                'app_id': ansible_cyberark_app_id,
                'safe': safe,
                'object': object_name,
                'validate_certs': false
              }) }}"
          no_log: true
          delegate_to: localhost

        - name: 3. Configurar credenciales SSH (sin forzar become_password global aun)
          ansible.builtin.set_fact:
            ansible_user: "{{ ssh_user }}"
            ansible_password: "{{ cyberark_retrieved_pass }}"
          no_log: true

        # 4A. Validar SSH puro (sin sudo)
        - name: 4A. Validar conexion SSH base (usuario sin elevar)
          ansible.builtin.ping:
          register: check_ssh

        # 4B. Diagnosticar reglas de sudo exactas del usuario (raw evita fallo de python)
        - name: 4B. Inspeccionar permisos sudo del usuario (sudo -n -l)
          ansible.builtin.raw: "sudo -n -l 2>&1"
          register: check_sudo_nopass
          changed_when: false
          failed_when: false

        - name: 4C. Mostrar diagnostico detallado de SSH y Sudo
          ansible.builtin.debug:
            msg:
              - "SSH Base: OK"
              - "RC sudo -n -l: {{ check_sudo_nopass.rc }}"
              - "Salida sudoers: {{ check_sudo_nopass.stdout | default('Sin salida') | trim }}"

        # 4D. Si sudo -n -l fallo porque pide password, probar inyectando password por stdin
        - name: 4D. Inspeccionar permisos sudo con password (echo pass | sudo -S -l)
          when: check_sudo_nopass.rc != 0
          ansible.builtin.raw: "echo '{{ cyberark_retrieved_pass }}' | sudo -S -l 2>&1"
          register: check_sudo_withpass
          no_log: true
          changed_when: false
          failed_when: false

        - name: 4E. Mostrar resultado de sudo con password (si aplico)
          when: check_sudo_nopass.rc != 0
          ansible.builtin.debug:
            msg:
              - "RC sudo -S -l: {{ check_sudo_withpass.rc }}"
              - "Salida sudo -S -l: {{ check_sudo_withpass.stdout | default('Sin salida') | regex_replace('.*password for.*:', '') | trim }}"

        # Validacion dura antes de continuar: al menos uno de los dos modos sudo debe funcionar
        - name: 4F. Verificar que el usuario tenga acceso a sudo
          ansible.builtin.assert:
            that:
              - (check_sudo_nopass.rc == 0) or (check_sudo_withpass.rc | default(1) == 0)
            fail_msg: "SUDO_DENEGADO: El usuario {{ ssh_user }} conecto por SSH pero no tiene permisos sudo validos."

        # 5. Validar si el proceso esta arriba (no requiere sudo)
        - name: 5. Buscar PID activo de {{ target_process }}
          ansible.builtin.command:
            cmd: "pgrep -af '{{ process_regex }}'"
          register: proceso_previo
          changed_when: false
          failed_when: false

        - name: 6. Registrar estado inicial y PIDs detectados
          ansible.builtin.set_fact:
            estado_final: "YA_ESTABA_ABAJO"
            pids_iniciales: "{{ proceso_previo.stdout_lines | map('split', ' ') | map('first') | list if proceso_previo.rc == 0 else [] }}"

        # 7. Matar proceso usando el metodo sudo que haya funcionado
        - name: 7. Ejecutar baja forzada (pkill -9) y verificar eliminacion
          when: proceso_previo.rc == 0
          block:
            - name: Mostrar PIDs detectados antes de matar
              ansible.builtin.debug:
                msg: "Proceso {{ target_process }} activo con PID(s): {{ pids_iniciales | join(', ') }}. Ejecutando pkill -9..."

            # Usa raw con sudo directo para evitar bloqueo de platform-python en sudoers restringidos
            - name: Ejecutar sudo pkill -9 -f {{ process_regex }} (sin password)
              when: check_sudo_nopass.rc == 0
              ansible.builtin.raw: "sudo -n pkill -9 -f '{{ process_regex }}' 2>&1"
              register: resultado_pkill_nopass
              changed_when: resultado_pkill_nopass.rc == 0

            - name: Ejecutar sudo pkill -9 -f {{ process_regex }} (con password)
              when: check_sudo_nopass.rc != 0
              ansible.builtin.raw: "echo '{{ cyberark_retrieved_pass }}' | sudo -S pkill -9 -f '{{ process_regex }}' 2>&1"
              register: resultado_pkill_withpass
              no_log: true
              changed_when: resultado_pkill_withpass.rc == 0

            - name: Mostrar salida cruda de pkill
              ansible.builtin.debug:
                msg: "Resultado pkill -> RC: {{ (resultado_pkill_nopass.rc if check_sudo_nopass.rc == 0 else resultado_pkill_withpass.rc) }} | Output: {{ (resultado_pkill_nopass.stdout if check_sudo_nopass.rc == 0 else resultado_pkill_withpass.stdout) | default('Killed') | trim }}"

            - name: Validar en kernel que el proceso haya desaparecido
              ansible.builtin.command:
                cmd: "pgrep -af '{{ process_regex }}'"
              register: proceso_posterior
              changed_when: false
              failed_when: false
              until: proceso_posterior.rc != 0
              retries: 5
              delay: 2

            - name: Confirmar muerte del proceso (KILLED)
              ansible.builtin.assert:
                that:
                  - proceso_posterior.rc != 0
                fail_msg: "PROCESO_INMORTAL: Se envio SIGKILL (-9) pero el PID {{ proceso_posterior.stdout_lines }} sigue vivo."

            - name: Marcar estado como KILLED exitoso
              ansible.builtin.set_fact:
                estado_final: "KILLED_OK"

      rescue:
        - name: Diagnosticar causa raiz del fallo
          ansible.builtin.set_fact:
            estado_final: "FALLIDO"
            detalle_error: >-
              {%- if 'PARAMETRO_INVALIDO' in (ansible_failed_result.msg | default('')) -%}
                Error de Survey: La version '{{ wildfly_version_seleccionada }}' no es valida (use 18 o 23).
              {%- elif 'Consultar password en CyberArk CCP' in (ansible_failed_task.name | default('')) -%}
                Error de CyberArk CCP: No se pudo recuperar la credencial (Safe: {{ safe | default('N/A') }}, Objeto: {{ object_name | default('N/A') }}).
              {%- elif 'Validar conexion SSH base' in (ansible_failed_task.name | default('')) -%}
                Error de Autenticacion SSH: CyberArk entrego la clave, pero {{ inventory_hostname }} rechazo el login SSH para '{{ ssh_user }}'. Detalle: {{ ansible_failed_result.msg | default('') }}
              {%- elif 'SUDO_DENEGADO' in (ansible_failed_result.msg | default('')) -%}
                Error de Permisos Sudo: '{{ ssh_user }}' entro por SSH, pero sudo fallo. Salida sin pass: [{{ check_sudo_nopass.stdout | default('') | trim }}] | Salida con pass: [{{ check_sudo_withpass.stdout | default('') | trim }}]
              {%- elif 'pkill' in (ansible_failed_task.name | default('')) -%}
                Error al ejecutar sudo pkill: RC={{ ansible_failed_result.rc | default('N/A') }}, Salida={{ ansible_failed_result.stdout | default(ansible_failed_result.msg | default('')) | trim }}
              {%- elif 'PROCESO_INMORTAL' in (ansible_failed_result.msg | default('')) -%}
                Proceso Bloqueado en Kernel (Estado D): {{ target_process }} no respondio a kill -9.
              {%- else -%}
                Fallo en tarea '{{ ansible_failed_task.name | default('Desconocida') }}': {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('Error no especificado')) }}
              {%- endif -%}

        - name: Reportar error claro en consola de AAP
          ansible.builtin.fail:
            msg: "[ERROR EN {{ inventory_hostname }}] {{ detalle_error }}"

      always:
        - name: Resumen ejecutivo de ejecucion por servidor
          ansible.builtin.debug:
            msg:
              - "Servidor: {{ inventory_hostname }}"
              - "Servicio objetivo: {{ target_process }}"
              - "Estado final: {{ estado_final }}"
              - "PIDs afectados: {{ pids_iniciales | default([]) | join(', ') if (pids_iniciales | default([]) | length > 0) else 'Ninguno' }}"
              - "Diagnostico: {{ detalle_error }}"