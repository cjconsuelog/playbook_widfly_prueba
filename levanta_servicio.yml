- name: Levantar servicios {{ nombre_servicio }}
  hosts: all
  gather_facts: false
  tasks:
    - name: Levanta servicio {{ nombre_servicio }}
      ansible.builtin.include_role:
        name: levanta_servicio
      vars:
        levanta_servicio_nombre_proceso: "wildfly-23"
        levanta_servicio_nombre_script: "bash /home/dockers/wildfly-23.0.0.Final/bin/standalone.sh -b 0.0.0.0 -Djboss.socket.binding.port-offset=1000 &"
        levanta_servicio_ruta_origen: "/home/dockers/wildfly-23.0.0.Final/standalone/"
      with_items: "{{ nombre_servicio }}"
      when: item == 'wildfly-23'

    - name: Levanta servicio {{ nombre_servicio }}
      ansible.builtin.include_role:
        name: levanta_servicio
      vars:
        levanta_servicio_nombre_proceso: "wildfly-18"
        levanta_servicio_nombre_script: "bash /usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/bin/startServer.sh &"
        levanta_servicio_ruta_origen: "/usr/local/bridge-server-rest-liverpool/appserver/wildfly-18.0.1.Final/standalone/"
      with_items: "{{ nombre_servicio }}"
      when: item == 'wildfly-18'
