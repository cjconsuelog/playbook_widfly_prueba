---
# test_cyberark_connectivity.yml
- name: Test CCP connectivity and credentials
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ccp_url: "https://ccp-seg.liverpool.com.mx"
    app_id: "POS"
    safe: "CCP_APPV"

  tasks:
    - name: Query CyberArk CCP
      cyberark.pas.cyberark_credential:
        api_base_url: "{{ ccp_url }}"
        app_id: "{{ app_id }}"
        query: "Safe={{ safe }}"
        validate_certs: true
        connection_timeout: 15
        query_format: Exact
      register: ccp_result
      ignore_errors: true

    - name: PASS – CCP responded
      ansible.builtin.debug:
        msg: "Connected to {{ ccp_url }} — HTTP {{ ccp_result.status_code }}"
      when: not ccp_result.failed

    - name: FAIL – Could not reach CCP
      ansible.builtin.fail:
        msg: "Connection FAILED → {{ ccp_result.msg | default(ccp_result) }}"
      when: ccp_result.failed
