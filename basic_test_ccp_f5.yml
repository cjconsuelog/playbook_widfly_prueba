---
- name: Prueba de conexion a CyberArk CCP usando variables del Template
  hosts: localhost
  gather_facts: false
  vars:
    safe: "BIG_F5_OGESCOBARD"
    object_name: "172.17.213.22-ogescobard"

  tasks:
    - name: Recuperar password desde CyberArk CCP
      set_fact:
        cyberark_password: "{{ lookup('cyberark_credential', {
          'api_base_url': ansible_cyberark_ccp_url,
          'app_id': ansible_cyberark_app_id,
          'safe': safe,
          'object': object_name,
          'validate_certs': false
        }) }}"

    - name: Mostrar el password recuperado (Solo para validar)
      debug:
        msg: "El password recuperado es: {{ cyberark_password }}"
