---
- name: Ver permisos sudo del usuario
  ansible.builtin.command: sudo -l
  register: permisos_sudo
  failed_when: false
  changed_when: false

- name: Mostrar permisos sudo
  ansible.builtin.debug:
    var: permisos_sudo.stdout_lines

- name: Intentar detener servicios y capturar error real
  ansible.builtin.shell: 'pkill -9 -f "[{{ item[0] }}]{{ item[1:] }}"'
  become: true
  register: resultado_pkill
  failed_when: false
  changed_when: true
  loop: "{{ nombre_proceso }}"

- name: Mostrar salida exacta de pkill
  ansible.builtin.debug:
    msg: "RC: {{ item.rc }} | STDOUT: {{ item.stdout }} | STDERR: {{ item.stderr }}"
  loop: "{{ resultado_pkill.results }}"
  loop_control:
    label: "{{ item.item }}"
