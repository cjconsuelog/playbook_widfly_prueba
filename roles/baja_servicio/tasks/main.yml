---
- name: Detener servicios
  ansible.builtin.shell: >
    set -o pipefail &&
    PIDS=$(ps -fea | grep "[{{ item[0] }}]{{ item[1:] }}" | awk '{print $2}');
    if [ -n "$PIDS" ]; then kill -9 $PIDS; fi
  become: true
  register: resultado_kill
  changed_when: resultado_kill.rc == 0
  loop: "{{ nombre_proceso }}"

- name: Esperar 2 segundos a que liberen recursos
  ansible.builtin.pause:
    seconds: 2

- name: Validar estado de cada servicio
  ansible.builtin.shell: 'set -o pipefail && ps -fea | grep "[{{ item[0] }}]{{ item[1:] }}"'
  register: estado_servicios
  failed_when: false
  changed_when: false
  loop: "{{ nombre_proceso }}"
  loop_control:
    label: "{{ item }}"

- name: Mostrar resultados
  ansible.builtin.debug:
    msg: >-
      El servicio "{{ item.item }}" {{
        'está DETENIDO ✅' if (item.stdout | trim == '') else
        'sigue ACTIVO ❌'
      }}
  loop: "{{ estado_servicios.results }}"