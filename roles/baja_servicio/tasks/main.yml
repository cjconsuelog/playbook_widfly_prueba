---
# tasks file for test-role
- name: Detener servicios
  ansible.builtin.command: 'pkill -9 -f "{{ item }}"'
  failed_when: false
  changed_when: true
  loop: "{{ nombre_proceso }}"

- name: Validar estado de cada servicio
  ansible.builtin.shell: 'set -o pipefail && ps -fea | grep "{{ item }}" | grep -v grep'
  register: estado_servicios
  failed_when: false
  changed_when: false
  loop: "{{ nombre_proceso }}"
  loop_control:
    label: "{{ item }}"

- name: Mostrar resultados
  ansible.builtin.debug:
    msg: >-
      El servicio "{{ item.item }}" {{
        'está DETENIDO ✅' if (item.stdout | trim == '') else
        'sigue ACTIVO ❌'
      }}
  loop: "{{ estado_servicios.results }}"
