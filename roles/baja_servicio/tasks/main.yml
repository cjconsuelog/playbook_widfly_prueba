---
- name: Detener servicios
  ansible.builtin.shell: 'pkill -9 -f "[{{ item[0] }}]{{ item[1:] }}"'
  become: true
  register: resultado_pkill
  failed_when: resultado_pkill.rc not in [0, 1]
  changed_when: resultado_pkill.rc == 0
  loop: "{{ nombre_proceso }}"

- name: Validar estado de cada servicio
  ansible.builtin.shell: 'set -o pipefail && ps -fea | grep "[{{ item[0] }}]{{ item[1:] }}"'
  register: estado_servicios
  failed_when: false
  changed_when: false
  loop: "{{ nombre_proceso }}"
  loop_control:
    label: "{{ item }}"

- name: Mostrar resultados
  ansible.builtin.debug:
    msg: >-
      El servicio "{{ item.item }}" {{
        'está DETENIDO ✅' if (item.stdout | trim == '') else
        'sigue ACTIVO ❌'
      }}
  loop: "{{ estado_servicios.results }}"