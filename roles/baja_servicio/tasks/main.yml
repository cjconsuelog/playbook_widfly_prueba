---
# tasks file for baja_servicio
- name: 1. Validar estado inicial de los servicios
  ansible.builtin.command: "pgrep -fa '{{ item }}'"
  register: estado_inicial
  failed_when: estado_inicial.rc not in [0, 1]
  changed_when: false
  loop: "{{ nombre_proceso }}"
  loop_control:
    label: "{{ item }}"

- name: 1.1 [LOG] Procesos detectados antes de detener
  ansible.builtin.debug:
    msg:
      - "Servicio: {{ item.item }}"
      - "PIDs activos: {{ item.stdout_lines | map('regex_replace', '^([0-9]+).*', '\\1') | list if item.rc == 0 else [] }}"
  loop: "{{ estado_inicial.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: 2. Detener servicio ejecutando sudo pkill directo (sin wrapper become)
  ansible.builtin.command:
    argv:
      - sudo
      - pkill
      - "-9"
      - "-f"
      - "[{{ item.item[0] }}]{{ item.item[1:] }}"
  register: resultado_pkill
  when: item.rc == 0
  failed_when: resultado_pkill.rc not in [0, 1]
  changed_when: resultado_pkill.rc == 0
  loop: "{{ estado_inicial.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: 2.1 [LOG] Resultado de ejecución de sudo pkill
  ansible.builtin.debug:
    msg:
      - "Servicio: {{ item.item.item }}"
      - "Return Code: {{ item.rc | default('N/A') }}"
      - "STDOUT: {{ item.stdout | default('') }}"
      - "STDERR: {{ item.stderr | default('') }}"
  loop: "{{ resultado_pkill.results }}"
  loop_control:
    label: "{{ item.item.item }}"

- name: 3. Pausa breve para liberación de recursos del kernel
  ansible.builtin.pause:
    seconds: 2
  when: resultado_pkill is changed

- name: 4. Validar estado final de cada servicio
  ansible.builtin.command: "pgrep -fa '{{ item }}'"
  register: estado_final
  failed_when: estado_final.rc not in [0, 1]
  changed_when: false
  loop: "{{ nombre_proceso }}"
  loop_control:
    label: "{{ item }}"

- name: 5. Mostrar reporte final de ejecución
  ansible.builtin.debug:
    msg: >-
      El servicio "{{ item.item }}" {{
        'está DETENIDO ✅' if item.rc == 1 else
        'sigue ACTIVO ❌ -> ' + (item.stdout_lines | join(' | '))
      }}
  loop: "{{ estado_final.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: 6. Fallar el job si algún servicio continúa activo
  ansible.builtin.fail:
    msg: "CRÍTICO: El servicio {{ item.item }} sigue activo tras enviar SIGKILL."
  when: item.rc == 0
  loop: "{{ estado_final.results }}"
  loop_control:
    label: "{{ item.item }}"