---

- name: Elimina lista de archivos
  ansible.builtin.file:
    path: "{{ ruta_origen }}{{ item }}"
    state: absent
  with_items: "{{ archivo_eliminar | split('\n') }}"
  when: item | length > 0

- name: Encontrar archivos en la carpeta
  ansible.builtin.find:
    paths: "{{ ruta_origen }}"
    file_type: file
  register: archivos_encontrados

- name: Mostrar el conteo
  ansible.builtin.debug:
    msg: "Numero total de archivos: {{ archivos_encontrados.matched }}"

- name: Validar que el total de archivos coincide con num_archivos
  ansible.builtin.debug:
    msg: >
      {% if archivos_encontrados.matched | int == num_archivos | int %}
        ✅ El número de archivos ({{ archivos_encontrados.matched }}) coincide con el valor esperado ({{ num_archivos }}).
      {% else %}
        ❌ El número de archivos encontrados ({{ archivos_encontrados.matched }}) NO coincide con el valor esperado ({{ num_archivos }}).
      {% endif %}
  when: num_archivos is defined and num_archivos | string | length > 0

