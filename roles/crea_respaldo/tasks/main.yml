---
- name: Crea Respaldos {{ nombre_respaldo }}
  ansible.builtin.command: "cp -a {{ ruta_origen }} {{ ruta_destino }}"
  changed_when: true

- name: Validar que se creo el respaldo {{ nombre_respaldo }}
  ansible.builtin.command: "{{ comando }}"
  register: command_result
  changed_when: true

- name: Mostrar salida con el respaldo creado
  ansible.builtin.debug:
    msg: "{{ command_result.stdout_lines }}"

- name: Validar que se creó el respaldo {{ nombre_respaldo }}
  ansible.builtin.stat:
    path: "{{ ruta_destino }}"
  register: backup_stat

- name: Mostrar mensaje de validación
  ansible.builtin.debug:
    msg: >
      {% if backup_stat.stat.exists %}
        ✅ Respaldo creado correctamente en {{ backup_stat.stat.path }}
      {% else %}
        ❌ No se pudo crear el respaldo en {{ ruta_destino }}
      {% endif %}
